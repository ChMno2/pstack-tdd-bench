[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pstack-tdd-bench"
version = "0.1.0"
description = "Pinned, reproducible harness comparing a baseline coding agent with the pstack workflow on AI-assisted TDD"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "pytest-cov==5.0.0", "mutmut==3.7.0", "ruff"]

[project.scripts]
bench = "bench.cli:main"

[tool.setuptools.packages.find]
include = ["bench*"]

[tool.setuptools.package-data]
"bench.harness" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# test data (fixture source code, expected strings) is clearer on one line
"tests/**" = ["E501"]
