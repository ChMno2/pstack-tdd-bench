name: run

# One experiment batch: a task under one condition, 1-3 repetitions, each in a fresh pinned container.
# Manual trigger only: this workflow is the only one that receives model credentials.
on:
  workflow_dispatch:
    inputs:
      task:
        description: Task directory
        required: true
        default: tasks/T00-smoke
      condition:
        description: Condition
        type: choice
        options: [C1, C2a]
        required: true
      reps:
        description: Repetitions
        type: choice
        options: ["1", "2", "3"]
        default: "1"
      auth:
        description: subscription = CLAUDE_CODE_OAUTH_TOKEN (pilot), api = ANTHROPIC_API_KEY (full runs)
        type: choice
        options: [subscription, api]
        default: subscription

permissions:
  contents: read
  packages: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.r.outputs.image }}
      reps: ${{ steps.r.outputs.reps }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: |
          image="$(head -n 1 image/IMAGE_DIGEST)"
          case "$image" in
            ghcr.io/*@sha256:*) ;;
            *) echo "image/IMAGE_DIGEST does not hold a digest reference: $image"; exit 1 ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "reps=$(python3 -c 'import json,sys; print(json.dumps(list(range(1, int(sys.argv[1]) + 1))))' '${{ inputs.reps }}')" >> "$GITHUB_OUTPUT"

  run:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        rep: ${{ fromJSON(needs.resolve.outputs.reps) }}
    container:
      image: ${{ needs.resolve.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: lims
          POSTGRES_PASSWORD: lims
          POSTGRES_DB: lims
        options: >-
          --health-cmd "pg_isready -U lims" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://lims:lims@postgres:5432/lims
      TEST_DATABASE_URL: postgresql+asyncpg://lims:lims@postgres:5432/lims_test
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ci-test-secret-not-for-prod
      ENV: ci
      BENCH_IMAGE_DIGEST: ${{ needs.resolve.outputs.image }}
      BENCH_POSTGRES_DIGEST: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
      BENCH_REDIS_DIGEST: redis:7-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Lock the bench checkout (tasks, references, planted bugs) away from the agent
        run: chown -R root:root "$GITHUB_WORKSPACE" && chmod 700 "$GITHUB_WORKSPACE"
      - name: Run the agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.auth == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          ANTHROPIC_API_KEY: ${{ inputs.auth == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          mkdir -p /bench-runs && chmod 755 /bench-runs
          bench run --task "${{ inputs.task }}" --condition "${{ inputs.condition }}" --rep "${{ matrix.rep }}" \
            --out /bench-runs --sut-repo "$GITHUB_WORKSPACE/sut/lims" \
            --plugin-dir /opt/pstack --home /home/agent --as-user agent
      - name: The agent cannot read the reference implementation
        run: |
          if runuser -u agent -- cat "$GITHUB_WORKSPACE/${{ inputs.task }}/reference.patch" > /dev/null 2>&1; then
            echo "agent can read the reference patch"; exit 1
          fi
      - name: Score twice and require identical results
        run: |
          d="$(ls -d /bench-runs/*/)"
          bench score "$d" --task "${{ inputs.task }}" --sut-repo "$GITHUB_WORKSPACE/sut/lims"
          cp "$d/score.json" /tmp/score-first.json
          bench score "$d" --task "${{ inputs.task }}" --sut-repo "$GITHUB_WORKSPACE/sut/lims"
          diff /tmp/score-first.json "$d/score.json"
          cat "$d/score.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload run directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ inputs.condition }}-r${{ matrix.rep }}-${{ github.run_id }}
          path: /bench-runs
          retention-days: 90
